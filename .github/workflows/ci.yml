name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests run against an ephemeral local SQLite file created by `prisma migrate
  # deploy`; no real database is ever touched. Set before install so the adapter
  # resolves on first import.
  DATABASE_URL: "file:./ci.db"

jobs:
  quality:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Create the schema for the ephemeral SQLite DB the integration tests use.
      - name: Prepare test database
        run: pnpm exec prisma migrate deploy

      # Runs the full suite and enforces the lib/ coverage gate (test:coverage).
      - name: Test suite + coverage gate
        run: pnpm test:coverage

  # Blocks PRs that add new high-severity vulnerabilities or unapproved
  # licenses, while ignoring the pre-existing baseline (lodash advisories have
  # no patched release). Runs on the PR diff, so it is diff-based by design.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
